<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Gestor de Torneos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 Gestor de Torneos</h1>
            <p>Sistema simple para organizar competiciones</p>
        </header>

        <!-- Configuración -->
        <section class="config-section">
            <h2>⚙️ Configuración</h2>
            
            <div class="form-group">
                <label>Deporte:</label>
                <select id="sportSelect">
                    <option value="football">⚽ Fútbol</option>
                    <option value="basketball">🏀 Baloncesto</option>
                    <option value="tennis">🎾 Tenis</option>
                    <option value="chess">♟️ Ajedrez</option>
                    <option value="esports">🎮 eSports</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sistema de Competición:</label>
                <select id="formatSelect">
                    <option value="single">Eliminación Simple</option>
                    <option value="double">Doble Eliminación</option>
                    <option value="roundRobin">Round-Robin (Todos vs Todos)</option>
                    <option value="swiss">Sistema Suizo</option>
                </select>
            </div>

            <div class="form-group">
                <label>Número de Participantes:</label>
                <input type="number" id="numParticipants" min="4" max="64" value="8">
            </div>

            <div class="form-group">
                <label>Nombres de Participantes (uno por línea):</label>
                <textarea id="participantsList" rows="6" placeholder="Equipo 1&#10;Equipo 2&#10;Equipo 3&#10;Equipo 4&#10;Equipo 5&#10;Equipo 6&#10;Equipo 7&#10;Equipo 8"></textarea>
            </div>

            <button onclick="generateTournament()" class="btn-primary">
                🎲 Generar Torneo
            </button>
        </section>

        <!-- Bracket Display -->
        <section id="bracketSection" class="hidden">
            <h2>📊 Llaves del Torneo</h2>
            <div id="bracketContainer"></div>
        </section>

        <!-- Clasificación -->
        <section id="standingsSection" class="hidden">
            <h2>📈 Clasificación</h2>
            <div id="standingsContainer"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>

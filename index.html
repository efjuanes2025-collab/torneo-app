<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Gestor de Torneos Profesional v2.0</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header Principal -->
        <header class="main-header">
            <h1>🏆 Gestor de Torneos Profesional</h1>
            <p>Sistema tipo Mundial: Fase de Grupos + Eliminatorias</p>
        </header>

        <!-- Notificaciones -->
        <div id="notification" class="notification hidden"></div>

        <!-- Configuración -->
        <section class="config-section">
            <h2>⚙️ Configuración del Torneo</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Deporte:</label>
                    <select id="sportSelect" onchange="updateSportIcon()">
                        <option value="football">⚽ Fútbol</option>
                        <option value="basketball">🏀 Baloncesto</option>
                        <option value="tennis">🎾 Tenis</option>
                        <option value="chess">♟️ Ajedrez</option>
                        <option value="esports">🎮 eSports</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Número de Grupos:</label>
                    <select id="numGroups" onchange="updateTeamCount()">
                        <option value="2">2 Grupos</option>
                        <option value="4" selected>4 Grupos</option>
                        <option value="8">8 Grupos</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Equipos por Grupo:</label>
                    <select id="teamsPerGroup">
                        <option value="3">3 Equipos</option>
                        <option value="4" selected>4 Equipos</option>
                        <option value="5">5 Equipos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Canchas/Escenarios:</label>
                    <select id="numVenues">
                        <option value="1">1 Cancha</option>
                        <option value="2">2 Canchas</option>
                        <option value="3" selected>3 Canchas</option>
                        <option value="4">4 Canchas</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Participantes (uno por línea):</label>
                <textarea id="participantsList" rows="10" placeholder="Equipo 1&#10;Equipo 2&#10;Equipo 3&#10;Equipo 4..."></textarea>
                <div id="teamCount" class="text-muted"></div>
            </div>

            <div class="button-group">
                <button onclick="generateTournament()" class="btn-primary">
                    🎲 Generar Torneo
                </button>
                <button onclick="loadExample()" class="btn-secondary">
                    📋 Cargar Ejemplo
                </button>
                <button onclick="saveTournament()" class="btn-secondary">
                    💾 Guardar
                </button>
                <button onclick="loadTournament()" class="btn-secondary">
                    📂 Cargar
                </button>
                <button onclick="exportFullReport()" class="btn-secondary">
                    📄 Reporte Completo
                </button>
            </div>
        </section>

        <!-- Dashboard Principal -->
        <section id="dashboardSection" class="hidden">
            <div class="dashboard-grid">
                <div class="stat-card">
                    <h3>Participantes</h3>
                    <p id="statParticipants">0</p>
                </div>
                <div class="stat-card">
                    <h3>Grupos</h3>
                    <p id="statGroups">0</p>
                </div>
                <div class="stat-card">
                    <h3>Partidos Jugados</h3>
                    <p id="statPlayed">0</p>
                </div>
                <div class="stat-card">
                    <h3>Partidos Restantes</h3>
                    <p id="statRemaining">0</p>
                </div>
            </div>
        </section>

        <!-- Fase de Grupos -->
        <section id="groupsPhaseSection" class="hidden">
            <div class="section-header">
                <h2>📊 Fase de Grupos</h2>
                <div>
                    <button onclick="exportPDF('groups')" class="btn-pdf">📄 Exportar Grupos</button>
                    <button onclick="exportPDF('standings')" class="btn-pdf">📊 Exportar Tablas</button>
                </div>
            </div>
            
            <!-- Grupos -->
            <div id="groupsContainer"></div>
            
            <!-- Fixture de Grupos -->
            <div id="groupMatchesContainer"></div>
            
            <!-- Tablas por Grupo -->
            <div id="groupStandingsContainer"></div>
        </section>

        <!-- Fase Eliminatoria -->
        <section id="knockoutSection" class="hidden">
            <div class="section-header">
                <h2>🏆 Fase Eliminatoria</h2>
                <button onclick="exportPDF('bracket')" class="btn-pdf">📄 Exportar Eliminatorias</button>
            </div>
            
            <!-- Clasificados -->
            <div id="qualifiedTeamsContainer"></div>
            
            <!-- Brackets -->
            <div id="bracketContainer"></div>
        </section>

        <!-- Partidos -->
        <section id="matchesSection" class="hidden">
            <div class="section-header">
                <h2>📅 Calendario de Partidos</h2>
                <button onclick="exportPDF('matches')" class="btn-pdf">📄 Exportar Calendario</button>
            </div>
            <div id="matchesContainer"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Gestor de Torneos Profesional</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header Principal -->
        <header class="main-header">
            <h1 id="headerTitle">🏆 Gestor de Torneos Profesional</h1>
            <p>Sistema inteligente para cualquier tipo de competición</p>
        </header>

        <!-- Notificaciones -->
        <div id="notification" class="notification hidden"></div>

        <!-- Configuración -->
        <section class="config-section">
            <h2>⚙️ Configuración del Torneo</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="sportSelect">Deporte:</label>
                    <select id="sportSelect" onchange="onSportChange()">
                        <optgroup label="🏆 Deportes Colectivos">
                            <option value="football">⚽ Fútbol</option>
                            <option value="basketball">🏀 Baloncesto</option>
                            <option value="volleyball">🏐 Voleibol</option>
                            <option value="handball">🤾 Balonmano</option>
                        </optgroup>
                        <optgroup label="🎯 Deportes Individuales">
                            <option value="tennis">🎾 Tenis</option>
                            <option value="chess">♟️ Ajedrez</option>
                            <option value="padel">🏸 Pádel</option>
                            <option value="table_tennis">🏓 Tenis de Mesa</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label for="formatSelect">Formato de Competición:</label>
                    <select id="formatSelect" onchange="onFormatChange()">
                        <option value="auto">🤖 Automático (Recomendado)</option>
                        <option value="groups_knockout">👥 Grupos + Eliminatorias</option>
                        <option value="single_elimination">🏆 Eliminación Directa</option>
                        <option value="round_robin">🔄 Round-Robin (Todos vs Todos)</option>
                        <option value="swiss">🎯 Sistema Suizo</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="numParticipants">Número de Equipos/Jugadores:</label>
                    <input type="number" id="numParticipants" min="2" max="64" value="8" onchange="updateTeamCount()">
                </div>

                <div class="form-group">
                    <label for="numGroups">Número de Grupos:</label>
                    <input type="number" id="numGroups" min="1" max="16" value="2" onchange="updateRecommendations()">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="numVenues">Canchas/Escenarios:</label>
                    <input type="number" id="numVenues" min="1" max="10" value="2">
                </div>

                <div class="form-group">
                    <label for="matchDuration">Duración por Partido (minutos):</label>
                    <input type="number" id="matchDuration" min="5" max="180" value="30">
                </div>
            </div>

            <div class="form-group">
                <label for="participantsList">Participantes (uno por línea):</label>
                <textarea id="participantsList" rows="8" placeholder="Equipo 1&#10;Equipo 2&#10;Equipo 3&#10;Equipo 4&#10;Equipo 5&#10;Equipo 6&#10;Equipo 7&#10;Equipo 8"></textarea>
                <div id="teamCount" class="info-text"></div>
                <div id="recommendationInfo" class="info-box"></div>
            </div>

            <div class="button-group">
                <button type="button" onclick="generateTournament()" class="btn-primary">🎲 Generar Torneo</button>
                <button type="button" onclick="loadExample()" class="btn-secondary">📋 Cargar Ejemplo</button>
                <button type="button" onclick="saveTournament()" class="btn-secondary">💾 Guardar</button>
                <button type="button" onclick="loadTournament()" class="btn-secondary">📂 Cargar</button>
                <button type="button" onclick="exportFullReport()" class="btn-secondary">📄 Reporte</button>
            </div>
        </section>

        <!-- Dashboard -->
        <section id="dashboardSection" class="hidden">
            <div class="dashboard-grid">
                <div class="stat-card">
                    <h3>Participantes</h3>
                    <p id="statParticipants">0</p>
                </div>
                <div class="stat-card">
                    <h3>Grupos</h3>
                    <p id="statGroups">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Partidos</h3>
                    <p id="statTotalMatches">0</p>
                </div>
                <div class="stat-card">
                    <h3>Partidos Jugados</h3>
                    <p id="statPlayed">0</p>
                </div>
            </div>
        </section>

        <!-- Fase de Grupos -->
        <section id="groupsSection" class="hidden">
            <div class="section-header">
                <h2>📊 Fase de Grupos</h2>
                <div>
                    <button type="button" onclick="exportPDF('groups')" class="btn-pdf">📄 Exportar</button>
                </div>
            </div>
            <div id="groupsContainer"></div>
            <div id="fixtureContainer"></div>
            <div id="standingsContainer"></div>
        </section>

        <!-- Eliminatorias -->
        <section id="knockoutSection" class="hidden">
            <div class="section-header">
                <h2>🏆 Fase Eliminatoria</h2>
                <button type="button" onclick="exportPDF('knockout')" class="btn-pdf">📄 Exportar</button>
            </div>
            <div id="qualifiedContainer"></div>
            <div id="bracketContainer"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>

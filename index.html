<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Van dentro del <head> -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Gestor de Torneos</title>
    
    <!-- LIBRERÍAS (se cargan automáticamente desde internet) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        
        .btn-primary {
            background: #4f46e5;
            color: white;
        }
        
        .btn-primary:hover {
            background: #4338ca;
        }
        
        .btn-secondary {
            background: #e0e7ff;
            color: #4f46e5;
        }
        
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .hidden {
            display: none;
        }
        
        .match-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background: white;
        }
        
        .score-input {
            width: 60px;
            text-align: center;
            font-weight: bold;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #4f46e5;
            color: white;
            padding: 10px;
        }
        
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Gestor de Torneos</h1>
            <p>Versión Simple y Funcional</p>
        </div>
        
        <!-- CONFIGURACIÓN -->
        <div class="card">
            <h2>⚙️ Configuración</h2>
            
            <label>Número de equipos:</label>
            <input type="number" id="numTeams" value="8" min="2" max="32" onchange="createTeamInputs()">
            
            <label>Número de grupos:</label>
            <input type="number" id="numGroups" value="2" min="1" max="8">
            
            <label>Número de canchas:</label>
            <input type="number" id="numVenues" value="3" min="1" max="10">
            
            <label>Equipos:</label>
            <div id="teamsContainer"></div>
            
            <div style="margin-top: 20px;">
                <button class="btn-primary" onclick="generateTournament()">🎲 Generar Torneo</button>
                <button class="btn-secondary" onclick="loadExample()">📋 Cargar Ejemplo</button>
            </div>
        </div>
        
        <!-- GRUPOS -->
        <div id="groupsSection" class="card hidden">
            <h2>👥 Grupos</h2>
            <div id="groupsContainer"></div>
        </div>
        
        <!-- PARTIDOS -->
        <div id="matchesSection" class="card hidden">
            <h2>📅 Partidos Programados</h2>
            <div id="matchesContainer"></div>
        </div>
        
        <!-- TABLAS -->
        <div id="standingsSection" class="card hidden">
            <h2>📊 Tablas de Posiciones</h2>
            <div id="standingsContainer"></div>
        </div>
    </div>
    
    <script>
        // ============ VARIABLES ============
        let teams = [];
        let groups = [];
        let matches = [];
        let standings = {};
        let numTeams = 8;
        let numGroups = 2;
        let numVenues = 3;
        
        // ============ INICIALIZAR ============
        window.onload = function() {
            console.log('Sistema cargado correctamente');
            loadExample();
        };
        
        // ============ CREAR INPUTS DE EQUIPOS ============
        function createTeamInputs() {
            numTeams = parseInt(document.getElementById('numTeams').value) || 8;
            const container = document.getElementById('teamsContainer');
            container.innerHTML = '';
            
            const defaultNames = [
                'Argentina', 'Brasil', 'Francia', 'Alemania',
                'España', 'Inglaterra', 'Portugal', 'Holanda'
            ];
            
            for (let i = 0; i < numTeams; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'team_' + i;
                input.value = defaultNames[i] || ('Equipo ' + (i + 1));
                input.placeholder = 'Nombre del equipo ' + (i + 1);
                container.appendChild(input);
            }
        }
        
        // ============ CARGAR EJEMPLO ============
        function loadExample() {
            document.getElementById('numTeams').value = 8;
            document.getElementById('numGroups').value = 2;
            document.getElementById('numVenues').value = 3;
            createTeamInputs();
            console.log('Ejemplo cargado: 8 equipos');
        }
        
        // ============ GENERAR TORNEO ============
        function generateTournament() {
            console.log('=== GENERANDO TORNEO ===');
            
            // Obtener configuración
            numTeams = parseInt(document.getElementById('numTeams').value);
            numGroups = parseInt(document.getElementById('numGroups').value);
            numVenues = parseInt(document.getElementById('numVenues').value);
            
            // Obtener equipos
            teams = [];
            for (let i = 0; i < numTeams; i++) {
                const input = document.getElementById('team_' + i);
                if (input && input.value.trim() !== '') {
                    teams.push(input.value.trim());
                }
            }
            
            console.log('Equipos:', teams);
            
            if (teams.length < 2) {
                alert('Necesitas al menos 2 equipos');
                return;
            }
            
            // Distribuir en grupos
            distributeGroups();
            
            // Generar partidos
            generateMatches();
            
            // Mostrar secciones
            document.getElementById('groupsSection').classList.remove('hidden');
            document.getElementById('matchesSection').classList.remove('hidden');
            document.getElementById('standingsSection').classList.remove('hidden');
            
            // Renderizar
            renderGroups();
            renderMatches();
            renderStandings();
            
            console.log('=== TORNEO GENERADO ===');
        }
        
        // ============ DISTRIBUIR GRUPOS ============
        function distributeGroups() {
            groups = [];
            standings = {};
            
            // Barajar equipos
            const shuffled = [...teams].sort(() => Math.random() - 0.5);
            
            // Crear grupos
            for (let i = 0; i < numGroups; i++) {
                groups.push({
                    id: i,
                    name: 'Grupo ' + String.fromCharCode(65 + i),
                    teams: []
                });
            }
            
            // Asignar equipos
            shuffled.forEach((team, index) => {
                const groupIndex = index % numGroups;
                groups[groupIndex].teams.push(team);
            });
            
            // Inicializar standings
            groups.forEach(group => {
                standings[group.id] = {};
                group.teams.forEach(team => {
                    standings[group.id][team] = {
                        points: 0, played: 0, wins: 0, draws: 0, losses: 0,
                        goalsFor: 0, goalsAgainst: 0, goalDiff: 0
                    };
                });
            });
        }
        
        // ============ GENERAR PARTIDOS (SIN CONFLICTOS DE CANCHAS) ============
        function generateMatches() {
            matches = [];
            let matchId = 1;
            let roundNumber = 1;
            
            // Generar todos los partidos
            const allMatches = [];
            
            groups.forEach(group => {
                const teamsInGroup = group.teams;
                
                for (let i = 0; i < teamsInGroup.length; i++) {
                    for (let j = i + 1; j < teamsInGroup.length; j++) {
                        allMatches.push({
                            groupId: group.id,
                            groupName: group.name,
                            team1: teamsInGroup[i],
                            team2: teamsInGroup[j]
                        });
                    }
                }
            });
            
            console.log('Total partidos a programar:', allMatches.length);
            
            // Programar por rondas
            const remaining = [...allMatches];
            
            while (remaining.length > 0) {
                const teamsPlaying = new Set();
                const matchesThisRound = [];
                const toRemove = [];
                
                // Seleccionar partidos sin conflicto
                for (let i = 0; i < remaining.length; i++) {
                    const match = remaining[i];
                    
                    if (!teamsPlaying.has(match.team1) && 
                        !teamsPlaying.has(match.team2) && 
                        matchesThisRound.length < numVenues) {
                        
                        matchesThisRound.push(match);
                        teamsPlaying.add(match.team1);
                        teamsPlaying.add(match.team2);
                        toRemove.push(i);
                    }
                }
                
                // Si no se pudo programar ningún partido, forzar el primero
                if (matchesThisRound.length === 0 && remaining.length > 0) {
                    matchesThisRound.push(remaining[0]);
                    toRemove.push(0);
                }
                
                // Asignar canchas
                matchesThisRound.forEach((match, index) => {
                    matches.push({
                        id: matchId,
                        groupId: match.groupId,
                        groupName: match.groupName,
                        round: roundNumber,
                        team1: match.team1,
                        team2: match.team2,
                        score1: null,
                        score2: null,
                        winner: null,
                        venue: 'Cancha ' + (index + 1),
                        status: 'pending'
                    });
                    matchId++;
                });
                
                // Eliminar partidos programados
                toRemove.sort((a, b) => b - a);
                toRemove.forEach(index => {
                    remaining.splice(index, 1);
                });
                
                roundNumber++;
            }
            
            console.log('Partidos programados:', matches);
            console.log('Total rondas:', roundNumber - 1);
        }
        
        // ============ RENDERIZAR GRUPOS ============
        function renderGroups() {
            const container = document.getElementById('groupsContainer');
            container.innerHTML = '';
            
            const colors = ['#dbeafe', '#d1fae5', '#e9d5ff', '#fce7f3'];
            
            groups.forEach((group, index) => {
                container.innerHTML += `
                    <div style="background: white; border-radius: 10px; padding: 15px; margin: 10px 0;">
                        <h3 style="background: ${colors[index]}; padding: 10px; border-radius: 5px;">
                            ${group.name}
                        </h3>
                        ${group.teams.map(team => `
                            <div style="padding: 8px; border-bottom: 1px solid #eee;">
                                ${team}
                            </div>
                        `).join('')}
                    </div>
                `;
            });
        }
        
        // ============ RENDERIZAR PARTIDOS ============
        function renderMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            
            // Agrupar por rondas
            const rounds = {};
            matches.forEach(match => {
                if (!rounds[match.round]) rounds[match.round] = [];
                rounds[match.round].push(match);
            });
            
            Object.keys(rounds).sort((a, b) => a - b).forEach(round => {
                container.innerHTML += `
                    <div style="margin: 20px 0;">
                        <h3 style="background: #4f46e5; color: white; padding: 10px; border-radius: 5px;">
                            📅 Ronda ${round} (${rounds[round].length} partidos simultáneos)
                        </h3>
                `;
                
                rounds[round].forEach(match => {
                    container.innerHTML += `
                        <div class="match-card">
                            <span style="background: #4f46e5; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px;">
                                🏟️ ${match.venue}
                            </span>
                            <small style="display: block; color: #666;">${match.groupName}</small>
                            <div style="margin: 8px 0;">
                                <span>${match.team1}</span>
                                <input type="number" class="score-input" placeholder="0" 
                                       value="${match.score1 ?? ''}"
                                       onchange="updateScore(${match.id}, 1, this.value)">
                            </div>
                            <div style="margin: 8px 0;">
                                <span>${match.team2}</span>
                                <input type="number" class="score-input" placeholder="0" 
                                       value="${match.score2 ?? ''}"
                                       onchange="updateScore(${match.id}, 2, this.value)">
                            </div>
                            ${match.winner ? `<strong style="color: green;">✅ ${match.winner}</strong>` : ''}
                        </div>
                    `;
                });
                
                container.innerHTML += '</div>';
            });
        }
        
        // ============ ACTUALIZAR MARCADOR ============
        function updateScore(matchId, teamNumber, score) {
            const match = matches.find(m => m.id === matchId);
            if (!match) return;
            
            if (teamNumber === 1) {
                match.score1 = parseInt(score) || 0;
            } else {
                match.score2 = parseInt(score) || 0;
            }
            
            if (match.score1 !== null && match.score2 !== null) {
                if (match.score1 > match.score2) {
                    match.winner = match.team1;
                } else if (match.score2 > match.score1) {
                    match.winner = match.team2;
                } else {
                    match.winner = 'Empate';
                }
                match.status = 'completed';
                
                updateStandings(match);
            }
            
            renderMatches();
            renderStandings();
        }
        
        // ============ ACTUALIZAR TABLA ============
        function updateStandings(match) {
            const groupStandings = standings[match.groupId];
            if (!groupStandings) return;
            
            const updateTeam = (teamName, result, gf, ga) => {
                const stats = groupStandings[teamName];
                if (!stats) return;
                
                stats.played++;
                stats.goalsFor += gf;
                stats.goalsAgainst += ga;
                stats.goalDiff = stats.goalsFor - stats.goalsAgainst;
                
                if (result === 'win') {
                    stats.wins++;
                    stats.points += 3;
                } else if (result === 'loss') {
                    stats.losses++;
                } else {
                    stats.draws++;
                    stats.points += 1;
                }
            };
            
            if (match.winner === match.team1) {
                updateTeam(match.team1, 'win', match.score1, match.score2);
                updateTeam(match.team2, 'loss', match.score2, match.score1);
            } else if (match.winner === match.team2) {
                updateTeam(match.team2, 'win', match.score2, match.score1);
                updateTeam(match.team1, 'loss', match.score1, match.score2);
            } else {
                updateTeam(match.team1, 'draw', match.score1, match.score2);
                updateTeam(match.team2, 'draw', match.score2, match.score1);
            }
        }
        
        // ============ RENDERIZAR TABLAS ============
        function renderStandings() {
            const container = document.getElementById('standingsContainer');
            container.innerHTML = '';
            
            groups.forEach(group => {
                const groupStandings = standings[group.id];
                if (!groupStandings) return;
                
                const sortedTeams = Object.entries(groupStandings)
                    .map(([name, stats]) => ({ name, ...stats }))
                    .sort((a, b) => b.points - a.points || b.goalDiff - a.goalDiff);
                
                container.innerHTML += `
                    <h3>${group.name}</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Equipo</th>
                                <th>PJ</th>
                                <th>PG</th>
                                <th>PE</th>
                                <th>PP</th>
                                <th>GF</th>
                                <th>GC</th>
                                <th>DG</th>
                                <th>Pts</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sortedTeams.map((team, idx) => `
                                <tr>
                                    <td>${idx + 1}</td>
                                    <td>${team.name}</td>
                                    <td>${team.played}</td>
                                    <td>${team.wins}</td>
                                    <td>${team.draws}</td>
                                    <td>${team.losses}</td>
                                    <td>${team.goalsFor}</td>
                                    <td>${team.goalsAgainst}</td>
                                    <td>${team.goalDiff}</td>
                                    <td><strong>${team.points}</strong></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <br>
                `;
            });
        }
    </script>
</body>
</html>
